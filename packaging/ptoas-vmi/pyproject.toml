# The VMI distribution intentionally installs the same `ptoas` import package
# and console script as the main distribution. The two wheels are mutually
# exclusive; this separate static PEP 621 project supplies the distribution
# name required by package indexes without a custom build backend.

[build-system]
requires = ["scikit-build-core>=0.12.2,<2", "pybind11<3", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "ptoas-vmi"
dynamic = ["version"]
description = "PTO Assembler & Optimizer with VMI support"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "numpy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
ptoas = "ptoas._cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "../.."
cmake.version = "CMakeLists.txt"
ninja.version = ">=1.10"
build.verbose = false
editable.mode = "redirect"
install.components = ["PTOAS_Python"]

[tool.scikit-build.wheel.packages]
ptodsl = "../../ptodsl/ptodsl"
ptoas = "../../ptodsl/ptoas"
tilelang_dsl = "../../tilelang-dsl/python/tilelang_dsl"

[tool.scikit-build.cmake.define]
PTOAS_RELEASE_VERSION_OVERRIDE = { env = "PTOAS_RELEASE_VERSION_OVERRIDE", default = "" }

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "../../CMakeLists.txt"
regex = 'set\s*\(\s*PTOAS_VMI_VERSION\s+"(?P<value>[0-9]+\.[0-9]+\.[0-9]+)"\s*\)'
